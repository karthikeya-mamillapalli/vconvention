<div class="topbar-strip d-none d-md-block">
  <div class="container d-flex justify-content-between">
    <span>{{ venue.business.hours }}</span>
    <span>
      <a [href]="'tel:' + venue.business.phone">{{ venue.business.phone }}</a>
      <span class="mx-2 opacity-50">|</span>
      <a [href]="'mailto:' + venue.business.email">{{ venue.business.email }}</a>
    </span>
  </div>
</div>

<nav class="navbar navbar-expand-lg site-nav" [class.scrolled]="scrolled">
  <div class="container">
    <a class="navbar-brand brand" routerLink="/" (click)="close()">
      <span class="brand-mark">V</span>
      <span class="brand-text">
        <span class="brand-name">V Convention</span>
        <span class="brand-sub">Kalyana Mandapam</span>
      </span>
    </a>

    <button class="navbar-toggler" type="button" (click)="toggle()"
            [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation">
      <span class="toggler-bar"></span><span class="toggler-bar"></span><span class="toggler-bar"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuOpen">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item" *ngFor="let link of links">
          <a class="nav-link" [routerLink]="link.path" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: link.exact }" (click)="close()">{{ link.label }}</a>
        </li>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a class="btn btn-gold btn-sm px-4" routerLink="/booking" (click)="close()">Check Dates</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
